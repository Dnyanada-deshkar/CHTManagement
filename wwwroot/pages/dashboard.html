<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet"
          href="/css/dashboard.css">
    <title>CHT Management - Dashboard</title>
</head>
<body>

    <h1>CHT Management Dashboard</h1>

    <p id="welcome"></p>


    <section class="dashboard-master-card">

        <div class="dashboard-master-heading">
            <div>
                <span class="dashboard-kicker">
                    MASTER MANAGEMENT
                </span>

                <h2>Masters</h2>
            </div>
        </div>


        <div class="dashboard-master-actions">

            <a href="/pages/location-type-master.html"
               class="dashboard-master-button">
                <span class="master-button-icon">
                    ▦
                </span>

                <span>
                    <strong>Location Type Master</strong>
                    <small>
                        Manage location types
                    </small>
                </span>

                <span class="master-arrow">
                    →
                </span>
            </a>

        </div>

    </section>


    <a href="/pages/location-master.html"
       class="dashboard-master-button">
        <span class="master-button-icon">
            ⌖
        </span>

        <span class="master-button-content">
            <strong>Location Master</strong>
            <small>Manage locations</small>
        </span>

        <span class="master-arrow">
            →
        </span>
    </a>

    <button id="logoutBtn">Logout</button>

    <script>

        const token = sessionStorage.getItem("token");
        const username = sessionStorage.getItem("username");
        const role = sessionStorage.getItem("role");

        if (!token) {
            window.location.href = "/pages/login.html";
        } else {
            document.getElementById("welcome").textContent =
                `Welcome ${username} (${role})`;
        }

        document.getElementById("logoutBtn")
            .addEventListener("click", function () {

                sessionStorage.removeItem("token");
                sessionStorage.removeItem("username");
                sessionStorage.removeItem("role");

                window.location.href = "/pages/login.html";
            });

    </script>

</body>
</html>
